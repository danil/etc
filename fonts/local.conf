<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

  <!-- ~~~~<danil@kutkevich.org> -->
  <!-- <http://wiki.gentoo.org/wiki/Fontconfig#Custom_system_wide_configurat>. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>PragmataPro Liga</family>
      <family>PragmataPro Mono Liga</family>
      <family>PragmataPro Mono</family>
      <family>PragmataPro</family>
      <family>Iosevka SS08</family>
      <family>Iosevka</family>
      <family>Fantasque Sans Mono</family>
      <family>Fira Code</family>
      <family>JetBrains Mono</family>
      <family>Source Code Pro</family>
      <family>DejaVu Sans Mono</family>
      <family>Hack</family>
      <family>Consolas</family>
    </prefer>
    <default><family>PragmataPro</family></default>
  </alias>

  <!-- ~~~~<danil@kutkevich.org> -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>PragmataPro Liga</family>
      <family>DejaVu Sans</family>
      <family>Public Sans</family>
      <family>Source Sans 3</family>
      <family>Noto Sans</family>
      <family>Fira Sans</family>
      <family>Fira Sans Condensed</family>
      <family>Fira Sans Extra Condensed</family>
      <family>Inter</family>
      <family>Input Sans</family>
      <family>Public Sans</family>
      <family>Atkinson Hyperlegible</family>
    </prefer>
    <default><family>DejaVu Sans</family></default>
  </alias>

  <!-- ~~~~<danil@kutkevich.org> -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>Source Serif 4</family>
      <family>Bitter</family>
      <family>Source Serif 4</family>
      <family>Noto Serif</family>
      <family>Linux Libertine</family>
    </prefer>
    <default><family>DejaVu Serif</family></default>
  </alias>

  <description>Enable Slashed Zero feature for Inter font system-wide</description>
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Inter</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>zero on</string>
    </edit>
  </match>

  <description>Enable Slashed Zero feature for Public Sans font system-wide</description>
  <match target="font">
    <test name="family" compare="eq" ignore-blanks="true">
      <string>Public Sans</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>zero on</string>
    </edit>
  </match>

