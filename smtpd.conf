#	$OpenBSD: smtpd.conf,v 1.10 2018/05/24 11:40:17 gilles Exp $

# This is the smtpd server system-wide configuration file.
# See smtpd.conf(5) for more information.

table aliases file:/etc/aliases
# ~~~~<danil@kutkeivch.org>
# table aliases file:/etc/aliases
table aliases file:/etc/smtpd/aliases
table secrets file:/etc/smtpd/secrets

# To also accept external mail over IPv4 or IPv6,
# respectively replace "listen on localhost" with:
#
# listen on 0.0.0.0
# listen on ::
listen on localhost

action "relay" relay
# ~~~~<danil@kutkeivch.org>
# <https://wiki.archlinux.org/index.php/OpenSMTPD#Local_mail_only>
# action "local" maildir alias <aliases>
action "local" mbox alias <aliases>

# # ~~~~<danil@kutkeivch.org>
# # action "local" maildir alias <aliases>
# # action "relay" relay
# action "relay" relay host "smtp+tls://postmaster@smtp.mailgun.org:587" auth <secrets> mail-from "@kutkeivch.org"

# Uncomment the following to accept external mail for domain "example.org"
#
# match from any for domain "example.org" action "local"
match for local action "local"
match from local for any action "relay"
